services:
  postgres:
    image: postgres:16-alpine
    container_name: truthguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: truthguard
      POSTGRES_PASSWORD: truthguard_password
      POSTGRES_DB: truthguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthguard -d truthguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
